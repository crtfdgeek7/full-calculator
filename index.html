<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modern Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="calculator" aria-label="Calculator">
    <h1>Calculator</h1>
    <p class="hint">Use the buttons or your keyboard</p>
    <section class="display" aria-live="polite">
      <div class="expression" id="expression"></div>
      <input id="input" value="" aria-label="Calculator display" readonly />
    </section>
    <section class="keypad" aria-label="Calculator controls">
      <button class="utility" onclick="clearInput()" aria-label="Clear calculator">AC</button>
      <button class="utility" onclick="deleteInput()" aria-label="Delete last character">DEL</button>
      <button class="operator" onclick="num('%')">%</button>
      <button class="operator" onclick="num('/')" aria-label="Divide">÷</button>
      <button onclick="num(7)">7</button>
      <button onclick="num(8)">8</button>
      <button onclick="num(9)">9</button>
      <button class="operator" onclick="num('*')" aria-label="Multiply">×</button>
      <button onclick="num(4)">4</button>
      <button onclick="num(5)">5</button>
      <button onclick="num(6)">6</button>
      <button class="operator" onclick="num('-')" aria-label="Subtract">−</button>
      <button onclick="num(1)">1</button>
      <button onclick="num(2)">2</button>
      <button onclick="num(3)">3</button>
      <button class="operator" onclick="num('+')" aria-label="Add">+</button>
      <button class="zero" onclick="num(0)">0</button>
      <button onclick="num('.')">.</button>
      <button class="equals" onclick="equal()" aria-label="Calculate result">=</button>
    </section>
  </main>
  <script src="script.js"></script>
</body>

</html>
